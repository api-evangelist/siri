name: Siri
description: Siri began as Siri Inc., a spinout of SRI International's CALO artificial-intelligence
  program, backed by Menlo Ventures and Morgenthaler Ventures. The company shipped an iOS virtual-assistant
  app in February 2010 and was acquired by Apple in April 2010. Siri now ships as Apple's built-in
  voice assistant across iPhone, iPad, Mac, Apple Watch, and HomePod. There is no independent public
  REST API or developer portal for Siri; the developer surface is SiriKit, an on-device Apple framework
  (Intents/App Intents) that lets iOS apps expose actions to Siri rather than call Siri as a web service.
